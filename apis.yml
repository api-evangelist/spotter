name: Spotter
description: >-
  Spotter is a creator-economy platform that invests in YouTube creators through
  capital, catalog licensing, and brand partnerships, and connects brands with top
  long-form YouTube creators for marketing and content opportunities. Its Spotter
  Studio product provides AI-assisted tooling that helps creators plan, ideate, and
  optimize their content and titles. The company reports more than $1 billion invested
  in creators and over 43 billion monthly views across a network that includes
  creators such as MrBeast, Critical Role, and Sam and Colby. Spotter is backed by
  SoftBank Vision Fund. No public developer API surface has been found at this time.
